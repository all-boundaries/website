name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: mise exec -- pnpm install --frozen-lockfile

      - run: mise exec -- pnpm exec playwright install --with-deps chromium

      - run: mise run build

      - name: Deploy to Cloudflare Pages
        run: mise exec -- pnpm dlx wrangler@4 pages deploy dist --project-name all-boundaries --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 111d3125f0558b56bfdeb1b5e7916e81
